<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقرر اللغة الإنجليزية - المستوى الثاني</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

  :root{
    --bg:#faf6ee;
    --surface:#ffffff;
    --surface-alt:#f4ecdd;
    --ink:#2a231c;
    --ink-soft:#6b5f52;
    --border:#e6d9c2;
    --primary:#0d7d72;
    --primary-soft:#d7efec;
    --shadow: 0 1px 2px rgba(42,35,28,.06), 0 6px 20px -8px rgba(42,35,28,.18);
    --radius: 14px;
    --font-ar-display:'Amiri', 'Traditional Arabic', serif;
    --font-ar-body:'Tajawal','Segoe UI',sans-serif;
    --font-en:'Lora','Georgia',serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161210;
      --surface:#201b16;
      --surface-alt:#28221b;
      --ink:#f1e9db;
      --ink-soft:#c3b8a6;
      --border:#3c332a;
      --primary:#4fc0b2;
      --primary-soft:#1c3934;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161210;
    --surface:#201b16;
    --surface-alt:#28221b;
    --ink:#f1e9db;
    --ink-soft:#c3b8a6;
    --border:#3c332a;
    --primary:#4fc0b2;
    --primary-soft:#1c3934;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    margin:0;
    font-family:var(--font-ar-body);
  }
  .page{direction:rtl; text-align:right; min-height:100%;}
  .en{font-family:var(--font-en); direction:ltr; unicode-bidi:isolate;}

  /* ---------- Shell layout ---------- */
  .shell{
    display:flex;
    min-height:100vh;
  }
  .nav{
    flex:0 0 260px;
    background:var(--surface);
    border-inline-start:1px solid var(--border);
    padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    gap:4px;
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    font-family:var(--font-ar-display);
    font-size:1.5rem;
    font-weight:700;
    color:var(--primary);
    margin:4px 4px 2px;
  }
  .brand-sub{
    font-size:.78rem;
    color:var(--ink-soft);
    margin:0 4px 16px;
    line-height:1.5;
  }
  .nav-btn{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:right;
    background:none;
    border:1px solid transparent;
    border-radius:10px;
    padding:10px 12px;
    font-family:var(--font-ar-body);
    font-size:.92rem;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
  }
  .nav-btn:hover{background:var(--surface-alt);}
  .nav-btn.active{
    background:var(--accent-soft, var(--primary-soft));
    border-color:var(--accent, var(--primary));
    color:var(--ink);
    font-weight:700;
  }
  .nav-dot{
    flex:0 0 10px; width:10px; height:10px; border-radius:50%;
    background:var(--accent, var(--primary));
  }
  .nav-check{margin-inline-start:auto; font-size:.8rem; color:var(--accent,var(--primary));}
  .nav-progress{
    margin-top:14px; padding:12px; border-radius:10px; background:var(--surface-alt);
    font-size:.78rem; color:var(--ink-soft);
  }
  .nav-progress-bar{height:6px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:6px;}
  .nav-progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .3s;}

  .main{
    flex:1;
    min-width:0;
    padding:32px clamp(16px,4vw,56px) 80px;
  }
  .container{max-width:760px; margin:0 auto;}

  /* mobile top tabs */
  .mobile-tabs{display:none;}

  @media (max-width: 860px){
    .shell{flex-direction:column;}
    .nav{
      position:sticky; top:0; height:auto; width:100%; flex-direction:row;
      overflow-x:auto; overflow-y:hidden; padding:10px 12px; gap:8px;
      border-inline-start:none; border-bottom:1px solid var(--border);
      align-items:center;
      scrollbar-width:thin;
      z-index:5;
    }
    .brand,.brand-sub,.nav-progress{display:none;}
    .nav-btn{flex:0 0 auto; white-space:nowrap;}
    .main{padding:20px 16px 64px;}
  }

  /* ---------- Typography ---------- */
  h1,h2,h3{font-family:var(--font-ar-display); font-weight:700; text-wrap:balance; margin:0 0 8px;}
  h1{font-size:2rem;}
  h2{font-size:1.5rem; color:var(--accent, var(--primary));}
  h3{font-size:1.1rem;}
  p{line-height:1.9; margin:0 0 12px; color:var(--ink);}
  .lede{color:var(--ink-soft); font-size:1rem; line-height:1.8;}

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--accent-soft, var(--primary-soft));
    color:var(--accent, var(--primary));
    border:1px solid var(--accent, var(--primary));
    border-radius:999px; padding:3px 12px; font-size:.78rem; font-weight:700;
  }
  .lesson-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    flex-wrap:wrap; margin-bottom:6px;
  }
  .lesson-num{
    font-family:var(--font-en); font-size:.8rem; color:var(--ink-soft); letter-spacing:.06em;
  }
  .en-title{font-family:var(--font-en); font-style:italic; color:var(--ink-soft); font-size:1.1rem;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 22px; margin:0 0 20px; box-shadow:var(--shadow);
  }
  .card h3{color:var(--accent, var(--primary)); border-bottom:2px solid var(--accent-soft,var(--primary-soft)); padding-bottom:8px; margin-bottom:14px;}

  .timeline-fig{margin:0; padding:6px 0 0;}
  .timeline-fig svg{width:100%; max-width:560px; height:auto; display:block; margin:0 auto; color:var(--ink);}
  .timeline-fig figcaption{
    text-align:center; font-size:.86rem; color:var(--ink-soft); margin-top:10px; line-height:1.7;
  }

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 4px;}
  @media (max-width:560px){.form-grid{grid-template-columns:1fr;}}
  .form-item{background:var(--surface-alt); border-radius:10px; padding:10px 12px; font-size:.88rem;}
  .form-item b{display:block; font-size:.72rem; color:var(--ink-soft); font-weight:700; margin-bottom:3px;}

  table{width:100%; border-collapse:collapse; font-size:.85rem; margin:10px 0;}
  th,td{border:1px solid var(--border); padding:8px 10px; text-align:right; vertical-align:top;}
  th{background:var(--surface-alt);}

  ul.tight, ol.tight{margin:6px 0 0; padding-inline-start:22px; line-height:1.9;}
  .mistakes li{margin-bottom:6px;}
  .wrong{color:#a3261e; font-weight:500;}
  .wrong::before{content:"✗ "; font-weight:700;}
  .right{color:#146c43; font-weight:600;}
  .right::before{content:"✓ "; font-weight:700;}

  /* examples */
  .ex-group{margin-bottom:16px;}
  .ex-group h4{font-size:.85rem; color:var(--ink-soft); font-weight:700; margin:0 0 8px; display:flex; align-items:center; gap:8px;}
  .ex-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .ex-list li{
    background:var(--surface-alt); border-radius:10px; padding:10px 14px;
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  .src-tag{
    flex:0 0 auto; font-size:.7rem; font-weight:700; color:var(--accent,var(--primary));
    background:var(--accent-soft,var(--primary-soft)); border-radius:6px; padding:2px 8px;
  }
  .ex-en{font-family:var(--font-en); font-size:1.02rem; direction:ltr; text-align:left; flex:1; min-width:200px;}

  /* exercises */
  .exercise-set{margin-bottom:22px; border-top:1px dashed var(--border); padding-top:16px;}
  .exercise-set:first-of-type{border-top:none; padding-top:0;}
  .ex-item{margin-bottom:12px;}
  .ex-prompt{font-family:var(--font-en); direction:ltr; text-align:left; font-size:.98rem; margin-bottom:6px;}
  .ex-prompt .num{font-family:var(--font-ar-body); color:var(--ink-soft); font-weight:700; margin-right:10px; display:inline-block;}
  input.blank{
    font-family:var(--font-en); direction:ltr; border:1.5px solid var(--border); border-radius:8px;
    padding:5px 8px; font-size:.95rem; width:150px; background:var(--surface); color:var(--ink);
  }
  input.blank:focus{outline:2px solid var(--accent,var(--primary)); outline-offset:1px;}
  input.blank.ok{border-color:#2e7d32; background:#eaf6ea;}
  input.blank.bad{border-color:#c62828; background:#fdecea;}
  @media (prefers-color-scheme: dark){
    input.blank.ok{background:#173a1c;}
    input.blank.bad{background:#3a1717;}
  }

  .mcq-q{margin-bottom:14px;}
  .mcq-opts{display:flex; flex-direction:column; gap:6px; margin-top:6px;}
  .mcq-opt{
    display:flex; align-items:center; gap:8px; font-family:var(--font-en); direction:ltr; text-align:left;
    background:var(--surface); border:1.5px solid var(--border); border-radius:8px; padding:6px 10px;
    cursor:pointer; font-size:.92rem;
  }
  .mcq-opt.correct{border-color:#2e7d32; background:#eaf6ea; font-weight:700;}
  .mcq-opt.incorrect{border-color:#c62828; background:#fdecea;}
  @media (prefers-color-scheme: dark){
    .mcq-opt.correct{background:#173a1c;}
    .mcq-opt.incorrect{background:#3a1717;}
  }

  /* ---------- Flashcards ---------- */
  .flip-hint{font-size:.76rem; color:var(--ink-soft); margin:-4px 0 14px;}
  .flip-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin:10px 0 6px;}
  .flip-card{perspective:1000px; cursor:pointer; min-height:100px; outline:none;}
  .flip-card-inner{
    position:relative; width:100%; height:100%; min-height:100px;
    transition:transform .5s; transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-card-inner{transform:rotateY(180deg);}
  .flip-card-face{
    position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden;
    border-radius:10px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:10px; font-size:.85rem; line-height:1.35; box-shadow:var(--shadow); overflow:auto;
  }
  .flip-card-front{background:var(--surface-alt); color:var(--ink);}
  .flip-card-back{background:var(--accent-soft,var(--primary-soft)); color:var(--ink); transform:rotateY(180deg); font-weight:700;}
  .flip-card:focus-visible .flip-card-face{outline:2px solid var(--accent,var(--primary));}

  /* ---------- Drag & drop ---------- */
  .drag-item{margin-bottom:22px; padding-bottom:18px; border-bottom:1px dashed var(--border);}
  .drag-item:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
  .drag-slots{
    display:flex; flex-wrap:wrap; gap:8px; direction:ltr; text-align:left; margin:10px 0;
    min-height:44px; padding:10px; background:var(--surface-alt); border-radius:10px;
  }
  .drag-slot{
    min-width:54px; height:34px; border:1.5px dashed var(--border); border-radius:8px;
    display:flex; align-items:center; justify-content:center; padding:0 8px;
    font-family:var(--font-en); font-size:.92rem; background:var(--surface); box-sizing:border-box;
  }
  .drag-slot.filled{border-style:solid; cursor:pointer;}
  .drag-slot.correct{border-color:#2e7d32; background:#eaf6ea;}
  .drag-slot.incorrect{border-color:#c62828; background:#fdecea;}
  @media (prefers-color-scheme: dark){
    .drag-slot.correct{background:#173a1c;}
    .drag-slot.incorrect{background:#3a1717;}
  }
  .drag-bank{display:flex; flex-wrap:wrap; gap:8px; direction:ltr; text-align:left; margin-top:10px;}
  .chip{
    font-family:var(--font-en); font-size:.92rem; background:var(--accent-soft,var(--primary-soft));
    color:var(--ink); border:1px solid var(--accent,var(--primary)); border-radius:8px;
    padding:6px 12px; cursor:grab; user-select:none;
  }
  .chip:active{cursor:grabbing;}
  .drag-actions{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:6px;}

  .cat-bank{display:flex; flex-wrap:wrap; gap:8px; direction:ltr; text-align:left; margin-bottom:14px;}
  .cat-chip{
    font-family:var(--font-en); font-size:.85rem; direction:ltr; text-align:left;
    background:var(--accent-soft,var(--primary-soft)); color:var(--ink);
    border:1px solid var(--accent,var(--primary)); border-radius:8px;
    padding:7px 12px; cursor:grab; user-select:none; max-width:100%;
  }
  .cat-chip:active{cursor:grabbing;}
  .cat-zones{display:flex; flex-wrap:wrap; gap:10px; direction:ltr;}
  .cat-zone{
    flex:1 1 160px; min-height:76px; border:1.5px dashed var(--border); border-radius:10px;
    padding:8px; display:flex; flex-direction:column; gap:6px; background:var(--surface-alt); box-sizing:border-box;
  }
  .cat-zone .zone-label{font-family:var(--font-ar-body); font-size:.74rem; font-weight:700; color:var(--ink-soft); direction:rtl; text-align:right;}
  .cat-zone.filled{border-style:solid;}
  .cat-zone.correct{border-color:#2e7d32; background:#eaf6ea;}
  .cat-zone.incorrect{border-color:#c62828; background:#fdecea;}
  @media (prefers-color-scheme: dark){
    .cat-zone.correct{background:#173a1c;}
    .cat-zone.incorrect{background:#3a1717;}
  }

  .btn{
    font-family:var(--font-ar-body); font-weight:700; font-size:.88rem; cursor:pointer;
    background:var(--accent, var(--primary)); color:#fff; border:none; border-radius:999px;
    padding:9px 20px;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:none; border:1.5px solid var(--accent,var(--primary)); color:var(--accent,var(--primary));}
  .score-line{font-size:.86rem; font-weight:700; margin-top:8px; color:var(--accent,var(--primary));}

  .reveal-item{background:var(--surface-alt); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
  .reveal-item .en{display:block; margin:6px 0;}
  .ar-src{display:block; margin:6px 0; direction:rtl; text-align:right; font-family:var(--font-ar-body); font-size:1rem;}
  .reveal-ans{display:none; margin-top:6px; padding-top:6px; border-top:1px dashed var(--border);}
  .reveal-ans.shown{display:block;}
  .reveal-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:6px;}
  .self-check{display:flex; align-items:center; gap:6px; font-size:.82rem; color:var(--ink-soft);}

  .tip{
    background:var(--accent-soft, var(--primary-soft)); border-radius:10px; padding:12px 16px;
    font-size:.86rem; color:var(--ink); display:flex; gap:10px; align-items:flex-start; margin-top:24px;
  }

  .about-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media (max-width:700px){.about-grid{grid-template-columns:1fr;}}
  .about-card{background:var(--surface-alt); border-radius:10px; padding:14px 16px;}
  .about-card h4{margin:0 0 6px; font-size:.95rem; color:var(--primary);}
  .about-card p{font-size:.84rem; color:var(--ink-soft); margin:0; line-height:1.8;}

  .steps{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .steps li{display:flex; gap:12px; align-items:flex-start;}
  .step-n{
    flex:0 0 26px; height:26px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700;
    font-family:var(--font-en);
  }

  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .legend-chip{display:flex; align-items:center; gap:6px; font-size:.78rem; background:var(--surface-alt); border-radius:999px; padding:4px 10px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;}

  footer.credit{text-align:center; font-size:.75rem; color:var(--ink-soft); margin-top:40px;}
</style>
</head>
<body>
<div class="page" dir="rtl" lang="ar">
  <div class="shell">
    <nav class="nav" id="nav"></nav>
    <main class="main"><div class="container" id="content"></div></main>
  </div>
</div>
<script>
(function(){
  "use strict";

  /* ============ DATA ============ */
  var TENSES = [
    {
      id:"t1", n:1, key:"present-simple",
      nameAr:"المضارع البسيط", nameEn:"Present Simple",
      tagline:"عادات، حقائق ثابتة، وأوصاف دائمة",
      timelineKind:"repeated",
      timelineCaption:"الأفعال المتكرّرة تمتد عبر الماضي والحاضر والمستقبل معًا — لأنها عادة أو حقيقة ثابتة، لا لحظة واحدة بذاتها.",
      accent:"#0d7d72", accentSoft:"#d7efec", accentSoftDark:"#153c36",
      usageHtml:
        "<p>لكل جملة في المضارع البسيط فعل، ويُبنى بإحدى طريقتين أساسيتين — <b>لا تُعدّ إحداهما استثناءً على الأخرى</b>:</p>"+
        "<ol class=\"tight\">"+
        "<li><b>فعل حركي</b> (work, pray, believe…) — يُضاف له <span class=\"en\">-s/-es</span> مع <span class=\"en\">he/she/it</span>.</li>"+
        "<li><b>فعل الكينونة <span class=\"en\">to be</span></b> (<span class=\"en\">am/is/are</span>) — للوصف أو تحديد الهوية أو المكان، بلا أي حركة. هذا ما تعبّر عنه العربية غالبًا بجملة اسمية بلا فعل — لكن الإنجليزية لا تسمح بإسقاط الفعل أبدًا.</li>"+
        "</ol>"+
        "<div class=\"form-grid\">"+
        "<div class=\"form-item\"><b>مثبت</b><span class=\"en\">She works. / Allah is One.</span></div>"+
        "<div class=\"form-item\"><b>منفي</b><span class=\"en\">She doesn't work. / It isn't far.</span></div>"+
        "<div class=\"form-item\"><b>سؤال</b><span class=\"en\">Does she work? / Is it far?</span></div>"+
        "<div class=\"form-item\"><b>علامات زمنية</b><span class=\"en\">always, usually, often, every day, never</span></div>"+
        "</div>"+
        "<p><b>قاعدة الإملاء مع <span class=\"en\">he/she/it</span>:</b> غالبًا <span class=\"en\">+s</span> — والمنتهي بـ <span class=\"en\">-o/-ch/-sh/-ss/-x</span> يأخذ <span class=\"en\">-es</span> (<span class=\"en\">go→goes, watch→watches</span>) — وساكن+<span class=\"en\">y</span> تصبح <span class=\"en\">-ies</span> (<span class=\"en\">study→studies</span>) بينما حرف علة+<span class=\"en\">y</span> تأخذ <span class=\"en\">-s</span> فقط (<span class=\"en\">play→plays</span>).</p>"+
        "<p><b>أخطاء شائعة:</b></p><ul class=\"tight mistakes\">"+
        "<li><span class=\"en wrong\">He go to work.</span> ← <span class=\"en right\">He goes to work.</span> (لا تُسقطي <span class=\"en\">s</span> مع <span class=\"en\">he/she/it</span>)</li>"+
        "<li><span class=\"en wrong\">My father doctor.</span> ← <span class=\"en right\">My father is a doctor.</span> (الجملة الاسمية بالعربية تحتاج <span class=\"en\">to be</span> بالإنجليزية)</li>"+
        "</ul>",
      daily:[
        "I wake up before Fajr every day.",
        "My father drives to work at seven o'clock.",
        "She studies at the college on Sundays and Tuesdays.",
        "We usually have breakfast together.",
        "The library closes at nine in the evening.",
        "My sister doesn't drink coffee.",
        "Do you walk or take the bus to college?",
        "My grandmother is kind and patient."
      ],
      sourced:[
        {src:"الفاتحة", text:"Allah is the Lord of all the worlds."},
        {src:"الفاتحة", text:"He is the Most Merciful."},
        {src:"الفاتحة", text:"Every Muslim recites Surah Al-Fatiha in every unit of prayer."},
        {src:"حديث جبريل", text:"The Hadith of Jibril explains the meaning of Islam, Iman, and Ihsan."},
        {src:"حديث جبريل", text:"A Muslim believes in Allah, His angels, His books, and His messengers."},
        {src:"حديث جبريل", text:"Ihsan means that a worshipper worships Allah as if he sees Him."},
        {src:"الأصول الثلاثة", text:"Allah is our Lord, our Creator, and our Sustainer."},
        {src:"الأصول الثلاثة", text:"Every Muslim needs to know three fundamental principles."},
        {src:"الأصول الثلاثة", text:"Prophet Muhammad ﷺ is the final messenger of Allah."},
        {src:"آية قرآنية ٦:١٦٢", text:"\"Indeed, my prayer, my rites of sacrifice, my living and my dying are for Allah, Lord of the worlds.\""}
      ],
      fill:[
        {p:"My mother ___ (cook) breakfast every morning.", a:["cooks"]},

        marks += '<circle cx="'+mx+'" cy="'+lineY+'" r="5" '+accentFill+'/>';

  /* ============ DRAG & DROP SENTENCE BUILDER ============ */
  function shuffled(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    // avoid an accidental already-correct order when possible
    if(a.length > 1 && a.join(" ") === arr.join(" ")){
      var t0 = a[0]; a[0] = a[1]; a[1] = t0;
    }
    return a;
  }

  var draggedChip = null;

  function renderDragExercise(container, sentence, idx){
    var words = sentence.replace(/["“”]/g,"").split(" ");
    var item = el("div","drag-item");
    item.innerHTML = "<div class=\"ex-prompt\"><span class=\"num\">"+(idx+1)+".</span> رتّبي الكلمات لتكوين جملة صحيحة (اسحبيها، أو اضغطي عليها بالترتيب):</div>";

    var slots = el("div","drag-slots");
    words.forEach(function(){
      var slot = el("div","drag-slot");
      slots.appendChild(slot);
    });

    var bank = el("div","drag-bank");

    function placeInSlot(chip, slot){
      if(slot.firstChild){
        // slot occupied: swap its chip back to bank
        var occupant = slot.firstChild;
        slot.removeChild(occupant);
        occupant.classList.remove("chip-in-slot");
        bank.appendChild(occupant);
      }
      var parentSlot = chip.parentElement;
      if(parentSlot && parentSlot.classList.contains("drag-slot")){
        parentSlot.classList.remove("filled","correct","incorrect");
      }
      slot.appendChild(chip);
      slot.classList.add("filled");
      slot.classList.remove("correct","incorrect");
    }

    function returnToBank(chip){
      var parentSlot = chip.parentElement;
      if(parentSlot && parentSlot.classList.contains("drag-slot")){
        parentSlot.classList.remove("filled","correct","incorrect");
      }
      bank.appendChild(chip);
    }

    function firstEmptySlot(){
      var list = slots.querySelectorAll(".drag-slot");
      for(var i = 0; i < list.length; i++){
        if(!list[i].firstChild) return list[i];
      }
      return null;
    }

    function makeChip(word){
      var chip = el("span","chip", word);
      chip.setAttribute("draggable","true");
      chip.addEventListener("dragstart", function(){ draggedChip = chip; });
      chip.addEventListener("dragend", function(){ draggedChip = null; });
      chip.addEventListener("click", function(){
        if(chip.parentElement && chip.parentElement.classList.contains("drag-slot")){
          returnToBank(chip);
        } else {
          var target = firstEmptySlot();
          if(target) placeInSlot(chip, target);
        }
      });
      return chip;
    }

    shuffled(words).forEach(function(word){
      bank.appendChild(makeChip(word));
    });

    Array.prototype.forEach.call(slots.querySelectorAll(".drag-slot"), function(slot){
      slot.addEventListener("dragover", function(e){ e.preventDefault(); });
      slot.addEventListener("drop", function(e){
        e.preventDefault();
        if(draggedChip) placeInSlot(draggedChip, slot);
      });
    });
    bank.addEventListener("dragover", function(e){ e.preventDefault(); });
    bank.addEventListener("drop", function(e){
      e.preventDefault();
      if(draggedChip) returnToBank(draggedChip);
    });

    var actions = el("div","drag-actions");
    var checkBtn = el("button","btn ghost","تحقّقي من الترتيب");
    var msg = el("span","score-line","");
    actions.appendChild(checkBtn);
    actions.appendChild(msg);

    checkBtn.addEventListener("click", function(){
      var slotEls = slots.querySelectorAll(".drag-slot");
      var filled = 0, correct = 0;
      Array.prototype.forEach.call(slotEls, function(slot, i){
        slot.classList.remove("correct","incorrect");
        var chip = slot.firstChild;
        if(!chip) return;
        filled++;
        if(chip.textContent === words[i]){
          slot.classList.add("correct");
          correct++;
        } else {
          slot.classList.add("incorrect");
        }
      });
      if(filled < words.length){
        msg.textContent = "أكملي كل الكلمات أولاً.";
      } else if(correct === words.length){
        msg.textContent = "صحيحة تمامًا! ✓";
      } else {
        msg.textContent = "راجعي الكلمات الملوّنة بالأحمر — "+correct+" / "+words.length+" صحيحة.";
      }
    });

    item.appendChild(slots);
    item.appendChild(bank);
    item.appendChild(actions);
    container.appendChild(item);
  }

  /* ============ DRAG & DROP CATEGORIZE (sort sentence into its tense) ============ */
  function renderCategorizeExercise(container, items){
    var wrap = el("div","");
    var bank = el("div","cat-bank");
    var zonesWrap = el("div","cat-zones");
    var zoneEls = {};

    TENSES.forEach(function(t){
      var zone = el("div","cat-zone");
      zone.appendChild(el("div","zone-label", t.n+". "+t.nameAr));
      zoneEls[t.id] = zone;
      zonesWrap.appendChild(zone);
    });

    function firstEmptyZone(){
      var found = null;
      Object.keys(zoneEls).some(function(id){
        if(!zoneEls[id].querySelector(".cat-chip")){ found = zoneEls[id]; return true; }
        return false;
      });
      return found;
    }

    function placeChipInZone(chip, zone){
      var existing = zone.querySelector(".cat-chip");
      if(existing){
        existing.classList.remove("chip-in-zone");
        bank.appendChild(existing);
      }
      var prevZone = chip.parentElement;
      if(prevZone && prevZone.classList.contains("cat-zone")){
        prevZone.classList.remove("filled","correct","incorrect");
      }
      zone.appendChild(chip);
      zone.classList.add("filled");
      zone.classList.remove("correct","incorrect");
    }

    function makeCatChip(item){
      var chip = el("span","cat-chip", "<span class=\"en\">"+item.text+"</span>");
      chip.dataset.tenseId = item.tenseId;
      chip.setAttribute("draggable","true");
      chip.addEventListener("dragstart", function(){ draggedChip = chip; });
      chip.addEventListener("dragend", function(){ draggedChip = null; });
      chip.addEventListener("click", function(){
        if(chip.parentElement && chip.parentElement.classList.contains("cat-zone")){
          chip.parentElement.classList.remove("filled","correct","incorrect");
          bank.appendChild(chip);
        } else {
          var target = firstEmptyZone();
          if(target) placeChipInZone(chip, target);
        }
      });
      return chip;
    }

    shuffled(items).forEach(function(item){ bank.appendChild(makeCatChip(item)); });

    Object.keys(zoneEls).forEach(function(id){
      var zone = zoneEls[id];
      zone.addEventListener("dragover", function(e){ e.preventDefault(); });
      zone.addEventListener("drop", function(e){
        e.preventDefault();
        if(draggedChip) placeChipInZone(draggedChip, zone);
      });
    });
    bank.addEventListener("dragover", function(e){ e.preventDefault(); });
    bank.addEventListener("drop", function(e){
      e.preventDefault();
      if(draggedChip){
        var prevZone = draggedChip.parentElement;
        if(prevZone && prevZone.classList.contains("cat-zone")) prevZone.classList.remove("filled","correct","incorrect");
        bank.appendChild(draggedChip);
      }
    });

    var actions = el("div","drag-actions");
    var checkBtn = el("button","btn ghost","تحقّقي من التصنيف");
    var msg = el("span","score-line","");
    actions.appendChild(checkBtn);
    actions.appendChild(msg);

    checkBtn.addEventListener("click", function(){
      var filled = 0, correct = 0;
      Object.keys(zoneEls).forEach(function(id){
        var zone = zoneEls[id];
        zone.classList.remove("correct","incorrect");
        var chip = zone.querySelector(".cat-chip");
        if(!chip) return;
        filled++;
        if(chip.dataset.tenseId === id){ zone.classList.add("correct"); correct++; }
        else zone.classList.add("incorrect");
      });
      if(filled < items.length){
        msg.textContent = "صنّفي كل الجمل أولاً.";
      } else if(correct === items.length){
        msg.textContent = "ممتازة! صنّفتِ كل الجمل بشكل صحيح. ✓";
      } else {
        msg.textContent = "راجعي المناطق الملوّنة بالأحمر — "+correct+" / "+items.length+" صحيحة.";
      }
    });

    wrap.appendChild(bank);
    wrap.appendChild(zonesWrap);
    wrap.appendChild(actions);
    container.appendChild(wrap);
  }

          if(idx === item.correct) correct++;
          else checked.closest(".mcq-opt").classList.add("incorrect");
        }
      });
      var pct = Math.round(correct/REVIEW.length*100);
      var msg;
      if(correct >= 10) msg = "ممتازة! أتقنتِ الأزمنة الستة. 🌟";
      else if(correct >= 8) msg = "جيدة جدًا — راجعي الأسئلة الملوّنة بالأحمر.";
      else if(correct >= 6) msg = "جيدة — يُنصح بمراجعة دروس الأزمنة التي أخطأتِ فيها.";
      else msg = "راجعي الدروس الستة مرة أخرى قبل إعادة المحاولة.";
      result.textContent = "النتيجة: "+correct+" / "+REVIEW.length+" ("+pct+"٪) — "+msg;
      try{
        progress.review = {score: correct+"/"+REVIEW.length};
        saveProgress(progress);
      }catch(e){}
    });

    container.appendChild(card);
  }

  function renderGlossary(container){
    container.appendChild(el("h1","","📚 قاموس المصطلحات"));
    container.appendChild(el("p","lede","أهم المفردات الواردة في نصوص المقرر (حديث جبريل، والأصول الثلاثة) — اكتبي في المربع للبحث بالعربية أو الإنجليزية."));

    var fcCard = el("div","card");
    fcCard.appendChild(el("h3","🗂️ بطاقات تعليمية"));
    fcCard.appendChild(el("p","flip-hint","اضغطي على أي بطاقة لقلبها ومعرفة المعنى."));
    renderFlipGrid(fcCard, GLOSSARY.slice().sort(function(a,b){ return a[0].localeCompare(b[0]); }).map(function(pair){
      return ["<span class=\"en\">"+pair[0]+"</span>", pair[1]];
    }));
    container.appendChild(fcCard);

    var card = el("div","card");
    card.appendChild(el("h3","📋 القائمة الكاملة"));
    var searchWrap = el("div","");
    searchWrap.style.marginBottom = "14px";
    var search = document.createElement("input");
    search.type = "text";
    search.placeholder = "ابحثي عن كلمة...";
    search.className = "text-input";
    search.style.width = "100%";
    search.style.boxSizing = "border-box";
    search.style.padding = "10px 12px";
    search.style.borderRadius = "10px";
    search.style.border = "1px solid var(--line, #ddd)";
    search.style.fontSize = "1rem";
    searchWrap.appendChild(search);
    card.appendChild(searchWrap);

    var table = document.createElement("table");
    var thead = "<tr><th>English</th><th>العربية</th></tr>";
    var sorted = GLOSSARY.slice().sort(function(a,b){ return a[0].localeCompare(b[0]); });
    var tbody = sorted.map(function(pair){
      return "<tr><td class=\"en\">"+pair[0]+"</td><td>"+pair[1]+"</td></tr>";
    }).join("");
    table.innerHTML = thead + tbody;
    card.appendChild(table);

    var emptyMsg = el("p","lede","لا توجد نتائج مطابقة.");
    emptyMsg.style.display = "none";
    card.appendChild(emptyMsg);

    search.addEventListener("input", function(){
      var q = norm(search.value);
      var rows = table.querySelectorAll("tr");
      var visibleCount = 0;
      rows.forEach(function(row, i){
        if(i === 0) return; // header
        var text = norm(row.textContent);
        var show = q === "" || text.indexOf(q) !== -1;
        row.style.display = show ? "" : "none";
        if(show) visibleCount++;
      });
      emptyMsg.style.display = visibleCount === 0 ? "" : "none";
    });

    container.appendChild(card);
  }

  /* ============ MAIN RENDER ============ */
  function render(){
    var container = document.getElementById("content");
    container.style.removeProperty("--accent");
    container.style.removeProperty("--accent-soft");
    container.innerHTML = "";
    if(active === "intro"){
      renderIntro(container);
    } else if(active === "review"){
      renderReview(container);
    } else if(active === "glossary"){
      renderGlossary(container);
    } else if(active === "dragpage"){
      renderDragPage(container);
    } else {
      var t = TENSES.filter(function(x){ return x.id === active; })[0];
      if(t) renderLesson(container, t);
    }
    var footer = el("footer","credit","مقرر اللغة الإنجليزية - المستوى الثاني - القسم العالي في معهد المسجد النبوي — إعداد: مها الحربي");
    container.appendChild(footer);
    renderNav();
  }

  render();

  /* Preserve state across hot-reload while the page is open */
  try{
    if(window.claude && window.claude.hot){
      window.claude.hot.snapshot(function(){ return {active: active}; });
      var boot = function(data){
        if(data && data.active) active = data.active;
        render();
      };
      if(window.claude.hot.ready) window.claude.hot.ready(boot);
      else boot(window.claude.hot.data);
    }
  }catch(e){}
})();
</script>
</body>
</html>
